version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Group all action bumps into a single PR per week. Keeps notification
    # noise low and ensures SHA-pinned `uses:` lines stay current across
    # ci.yml + pkg-release.yml. Grouped PRs land or revert atomically.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: scope

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # `patterns: ["*"]` groups every npm dependency — production and
    # development alike — into a single PR per week, so one lockfile churn
    # lands or reverts atomically instead of racing across parallel PRs.
    groups:
      npm:
        patterns: ["*"]
    # The presets are tested under TS 6 (`typescript`) and TS 7 (the
    # `typescript7` alias). A grouped major bump of `typescript` would quietly
    # make both legs TS 7 while CI stays green. `@types/node` majors follow
    # Node majors, so they move alongside the runtime layers. Bump either
    # major by hand, on purpose.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # `chore` (not `ci`) so subjects read `chore(deps): …` / `chore(deps-dev): …`
    # — Conventional, and a no-release type under the release-please bump rules,
    # so a dependency bump never cuts a version on its own. Both prefixes are
    # set explicitly: `prefix` alone leaves development-dependency bumps on
    # Dependabot's own default. See R-980 / R-823.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
